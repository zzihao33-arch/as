<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CM-HUB 面单与 BOL管理系统" />
    <title>CM-HUB | 海外仓工具站</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var storedMode = localStorage.getItem('cmhub-theme-mode');
        var mode = storedMode === 'light' || storedMode === 'dark' || storedMode === 'auto' ? storedMode : 'auto';
        var systemIsDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolvedTheme = mode === 'auto' ? (systemIsDark ? 'dark' : 'light') : mode;
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.dataset.themeMode = mode;
        if (resolvedTheme === 'dark') document.body.setAttribute('arco-theme', 'dark');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
