limit_req_zone $binary_remote_addr zone=cmhub_api_per_ip:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    # Replace with api.your-domain.com before enabling TLS. "_" permits a temporary IP-based smoke test.
    server_name _;

    # Matches the default LABEL_PDF_LIMIT. JSON remains capped separately by Express.
    client_max_body_size 20m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=cmhub_api_per_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
